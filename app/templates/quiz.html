{% extends 'base.html' %}
{% block content %}
<section class="card">
    <div class="card-header">
        <div>
            <p class="eyebrow">Quiz Challenge</p>
            <h1>{{ title }}</h1>
        </div>
        <div class="meta" style="text-align: right;">
            <p style="margin: 0 0 4px 0;">Welcome back</p>
            <strong>{{ username }}</strong>
        </div>
    </div>
    <form method="post" action="{{ url_for('main.submit') }}" class="quiz-form">
        <input type="hidden" name="topic" value="{{ topic }}">
        {% for q in questions %}
        <div class="question">
            <h2>Question {{ loop.index }} of {{ questions|length }}</h2>
            <p style="margin: 12px 0 16px 0; font-size: 16px; font-weight: 500;">{{ q.question }}</p>
            <div class="options">
                {% for opt in q.options %}
                <label class="option">
                    <input type="radio" name="{{ q.id }}" value="{{ opt }}" required>
                    <span>{{ opt }}</span>
                </label>
                {% endfor %}
            </div>
        </div>
        {% endfor %}
        <button type="submit" class="btn-primary">Submit Quiz</button>
    </form>
</section>
{% endblock %}
